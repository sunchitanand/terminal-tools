[package]
name = "tmux-selector"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tmux-selector"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
